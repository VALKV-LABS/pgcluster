openapi: 3.1.0
info:
  title: pgcluster agent API
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |
    `vk-agent host` calls these endpoints, and `pgcluster-admin` never calls a
    host. This is a public contract: anything that serves it can drive
    `vk-agent host`.

    Connections use TLS with a certificate from the management plane CA. An
    enrolment token ends in the SHA-256 of that CA's PEM file, so a new host
    fetches `/agent/v1/ca`, compares the hash and only then trusts the server.

    After enrolment every call uses mutual TLS. The host is identified by its
    certificate, so it can only read or report its own state.
servers:
  - url: https://pgcluster-admin.example.com:8444
tags:
  - name: enrolment
    description: Calls a host makes before it has a client certificate.
  - name: state
    description: Calls that need the host's client certificate.
paths:
  /agent/v1/ca:
    get:
      operationId: getCa
      summary: Fetch the CA certificate, to compare with the hash in the token
      tags: [enrolment]
      security: []
      responses:
        "200":
          description: The CA certificate.
          content:
            application/x-pem-file:
              schema:
                type: string
  /agent/v1/enroll:
    post:
      operationId: enroll
      summary: Exchange a single-use token and a key pair for a client certificate
      description: Tokens are single-use and expire after 15 minutes.
      tags: [enrolment]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "200":
          description: The host's identity and certificate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /agent/v1/certificate:
    post:
      operationId: rotateCertificate
      summary: Replace the client certificate before it expires
      tags: [state]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateRequest"
      responses:
        "200":
          description: The new certificate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /agent/v1/desired-state:
    get:
      operationId: getDesiredState
      summary: Read the instances this host should run, long-polled
      tags: [state]
      parameters:
        - name: generation
          in: query
          description: The generation the host already has. Answers at once if it differs.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: wait_seconds
          in: query
          description: How long to hold the request open.
          schema:
            type: integer
            minimum: 0
            maximum: 60
            default: 25
      responses:
        "200":
          description: The desired state. Holds secrets, so keep it private.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesiredState"
        "304":
          description: Nothing changed before `wait_seconds` ran out.
        "401":
          $ref: "#/components/responses/Error"
  /agent/v1/report:
    post:
      operationId: report
      summary: Report what is running, the host's address and its capacity
      tags: [state]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Report"
      responses:
        "204":
          description: Recorded.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /agent/v1/tasks/{id}/result:
    post:
      operationId: reportTaskResult
      summary: Say how a task went. The first answer stands
      tags: [state]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskResult"
      responses:
        "204":
          description: Recorded.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /agent/v1/repository-checks/{id}:
    post:
      operationId: reportRepositoryCheck
      summary: Say whether this host could write to a backup repository
      tags: [state]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryCheckResult"
      responses:
        "204":
          description: Recorded.
        "401":
          $ref: "#/components/responses/Error"
  /agent/v1/cluster:
    post:
      operationId: reportCluster
      summary: Report what a cluster's Raft leader knows
      description: Sent by the host of the leader. This is a record, and decides nothing.
      tags: [state]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterReport"
      responses:
        "204":
          description: Recorded.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /agent/v1/operations/{id}/log:
    post:
      operationId: appendOperationLog
      summary: Append step output to an operation
      tags: [state]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogEntry"
      responses:
        "204":
          description: Recorded.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
security:
  - mutualTLS: []
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    EnrollRequest:
      type: object
      required: [token, csr_pem]
      properties:
        token:
          type: string
          description: The part of the enrolment token before the dot.
        csr_pem:
          type: string
          description: A PEM certificate request for a key the host generated.
    EnrollResponse:
      type: object
      required: [host_id, certificate_pem]
      properties:
        host_id:
          type: string
        certificate_pem:
          type: string
    RotateRequest:
      type: object
      required: [csr_pem]
      properties:
        csr_pem:
          type: string
    RotateResponse:
      type: object
      required: [certificate_pem]
      properties:
        certificate_pem:
          type: string
    Resources:
      type: object
      required: [vcpu, memory_gb, storage_gb]
      properties:
        vcpu:
          type: number
          minimum: 0
        memory_gb:
          type: number
          minimum: 0
        storage_gb:
          type: number
          minimum: 0
    ReplicationMode:
      type: string
      enum: [async, sync, sync_strict]
    Peer:
      type: object
      required: [node, address, port_base]
      properties:
        node:
          type: string
        address:
          type: string
        port_base:
          type: integer
    Owner:
      type: object
      required: [username, scram_verifier]
      properties:
        username:
          type: string
        scram_verifier:
          type: string
    InstanceSecrets:
      type: object
      description: Material the instance needs, sent only to the host that runs it.
      required:
        - ca_cert_pem
        - cert_pem
        - key_pem
        - superuser_password
        - replication_password
        - auth_password
        - api_key
      properties:
        ca_cert_pem:
          type: string
        cert_pem:
          type: string
        key_pem:
          type: string
        superuser_password:
          type: string
        replication_password:
          type: string
        auth_password:
          type: string
        api_key:
          type: string
        next:
          description: Passwords about to replace these, during a rotation.
          oneOf:
            - $ref: "#/components/schemas/NextPasswords"
            - type: "null"
    NextPasswords:
      type: object
      required: [superuser_password, replication_password, auth_password, api_key]
      properties:
        superuser_password:
          type: string
        replication_password:
          type: string
        auth_password:
          type: string
        api_key:
          type: string
    BackupTarget:
      type: object
      description: Where a database's backups live. Names no backup tool.
      required: [type]
      properties:
        type:
          type: string
          enum: [s3, posix]
        path:
          type: [string, "null"]
        bucket:
          type: [string, "null"]
        prefix:
          type: [string, "null"]
        region:
          type: [string, "null"]
        endpoint:
          type: [string, "null"]
        path_style:
          type: boolean
        access_key_id:
          type: [string, "null"]
        secret_access_key:
          type: [string, "null"]
        encryption_key:
          type: [string, "null"]
          description: Base64, 32 bytes. Data is encrypted with it before it leaves the node.
    BackupPolicy:
      type: object
      required: [target, retain_full]
      properties:
        target:
          $ref: "#/components/schemas/BackupTarget"
        retain_full:
          type: integer
          description: Full backups to keep, with what depends on them.
    Restore:
      type: object
      required: [source, source_database]
      properties:
        source:
          $ref: "#/components/schemas/BackupTarget"
        target_time:
          type: [string, "null"]
          format: date-time
        source_database:
          type: string
          description: The name the database has inside the backup.
    Task:
      type: object
      description: |
        One-off work. Every node of the database gets it, and only the node that
        is the Raft leader or the Postgres primary runs it, since either can move.
      required: [id, kind, "on", params]
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - switchover
            - rolling_restart
            - replication_mode
            - backup
            - replace_member
            - alter_passwords
        "on":
          type: string
          enum: [leader, primary]
        params:
          type: object
    TaskResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        error:
          type: [string, "null"]
        output: {}
    RepositoryCheck:
      type: object
      required: [id, target]
      properties:
        id:
          type: string
        target:
          $ref: "#/components/schemas/BackupTarget"
    RepositoryCheckResult:
      type: object
      properties:
        error:
          type: [string, "null"]
    AdminCa:
      type: object
      required: [bundle_pem, renew_client_certificate]
      properties:
        bundle_pem:
          type: string
          description: Trust exactly these for the agent API.
        renew_client_certificate:
          type: boolean
          description: Ask for a client certificate from the CA now in use.
    ClusterReport:
      type: object
      required: [database_id]
      properties:
        database_id:
          type: string
        primary:
          type: [string, "null"]
        sync_degraded:
          type: boolean
        needs_reseed:
          type: array
          items:
            type: string
        failovers:
          type: array
          items:
            type: object
        backups:
          type: array
          items:
            $ref: "#/components/schemas/BackupReport"
        backup_error:
          type: [string, "null"]
    BackupReport:
      type: object
      required: [id, label, completed_at, size_bytes]
      properties:
        id:
          type: string
        label:
          type: string
        completed_at:
          type: integer
          format: int64
          description: Unix seconds.
        size_bytes:
          type: integer
          format: int64
    Instance:
      type: object
      required:
        - database_id
        - database_name
        - node
        - generation
        - postgres_version
        - resources
        - port_base
        - address
        - peers
        - bootstrap
        - backup
        - tasks
        - replication_mode
        - allowed_cidrs
        - extensions
        - owner
        - secrets
      properties:
        role:
          type: string
          enum: [member, replica]
          description: A replica is an external standby of another database, and runs no `pgcluster`.
        replicas:
          type: array
          description: External standbys of this database, admitted to its Postgres.
          items:
            $ref: "#/components/schemas/Peer"
        rename_from:
          type: [string, "null"]
          description: The name the database has in its data. The host renames it to `database_name` once it can write.
        database_id:
          type: string
        database_name:
          type: string
          description: The name of the database created for the owner.
        node:
          type: string
        generation:
          type: integer
          format: int64
          description: The database's generation.
        operation_id:
          type: [string, "null"]
          description: The operation applying this generation, for log lines.
        postgres_version:
          type: string
        resources:
          $ref: "#/components/schemas/Resources"
        port_base:
          type: integer
          description: First of ten consecutive ports.
        address:
          type: string
          description: The address peers reach this node at.
        peers:
          type: array
          description: The database's other nodes. Empty on a one-node database.
          items:
            $ref: "#/components/schemas/Peer"
        bootstrap:
          type: string
          enum: [initdb, seed, restore]
          description: |
            Where the node's first data comes from. A seeded node waits for the
            Raft leader to fill it from the primary.
        restore:
          description: With `bootstrap` of `restore`.
          oneOf:
            - $ref: "#/components/schemas/Restore"
            - type: "null"
        backup:
          description: "`null` when the database has no backups. WAL is then discarded, not archived."
          oneOf:
            - $ref: "#/components/schemas/BackupPolicy"
            - type: "null"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        replication_mode:
          $ref: "#/components/schemas/ReplicationMode"
        allowed_cidrs:
          type: array
          items:
            type: string
          description: Empty means no access.
        extensions:
          type: array
          items:
            type: string
        owner:
          $ref: "#/components/schemas/Owner"
        secrets:
          $ref: "#/components/schemas/InstanceSecrets"
    DesiredState:
      type: object
      required: [generation, instances]
      properties:
        generation:
          type: integer
          format: int64
          description: The host's generation, which increases with any change to its instances.
        instances:
          type: array
          items:
            $ref: "#/components/schemas/Instance"
        repository_checks:
          type: array
          description: Repositories this host should prove it can write to.
          items:
            $ref: "#/components/schemas/RepositoryCheck"
        admin_ca:
          description: Set during a rotation of the admin CA.
          oneOf:
            - $ref: "#/components/schemas/AdminCa"
            - type: "null"
    InstanceReport:
      type: object
      required: [database_id, node, observed_generation, state]
      properties:
        database_id:
          type: string
        node:
          type: string
        observed_generation:
          type: integer
          format: int64
        state:
          type: string
          enum: [starting, seeding, running, failed]
        error:
          type: [string, "null"]
        archived_until:
          type: [string, "null"]
          format: date-time
          description: Every commit before this is in the WAL archive. Only the primary reports it.
        server_version:
          type: [string, "null"]
          description: The release the running server reports, such as `18.1`.
    Report:
      type: object
      required: [observed_generation, version, address, capacity, instances]
      properties:
        observed_generation:
          type: integer
          format: int64
        version:
          type: string
          description: The `vk-agent` version.
        address:
          type: string
          description: The address clients and peers use to reach this host.
        capacity:
          $ref: "#/components/schemas/Resources"
        instances:
          type: array
          items:
            $ref: "#/components/schemas/InstanceReport"
        ca_fingerprint:
          type: string
          description: The SHA-256 of the CA bundle this host trusts.
        postgres_versions:
          type: object
          additionalProperties:
            type: string
          description: 'Each Postgres major installed, and its full release, such as `{"18": "18.1"}`.'
    LogEntry:
      type: object
      required: [message]
      properties:
        message:
          type: string
