openapi: 3.0.3
info:
  title: pgcluster admin API
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |
    One API for every cluster in a fleet.

    - Authentication is `Authorization: Bearer <key>`.
    - Errors are `{ "error": { "code": "...", "message": "..." } }`.
    - Lists are `{ "items": [...], "next_page_token": "..." }`, with `limit` and `page_token`.
    - Changes that take time return `202` and an operation.

    `x-stage` on an operation names the stage of the management plane spec that
    delivers it. Operations of later stages answer `404` until then.
servers:
  - url: https://pgcluster-admin.example.com:8443
tags:
  - name: hosts
    description: Machines running `vk-agent host`.
  - name: databases
    description: Postgres clusters of one or three nodes.
  - name: backups
    description: Repositories, backups and restore.
  - name: replicas
    description: External standbys in another region.
  - name: operations
    description: Long-running changes and the event feed.
  - name: health
    description: Liveness.
security:
  - bearerKey: []
paths:
  /health:
    get:
      operationId: health
      summary: Check that the service can reach its database
      tags: [health]
      security: []
      x-stage: 1
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/hosts:
    post:
      operationId: createHost
      summary: "Add a host and get its enrolment token, shown once"
      tags: [hosts]
      x-stage: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHost"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostEnrollment"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    get:
      operationId: listHosts
      summary: "List hosts with status, reported capacity and free capacity"
      tags: [hosts]
      x-stage: 1
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostList"
        "401":
          $ref: "#/components/responses/Error"
  /v1/hosts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getHost
      summary: "Read a host"
      tags: [hosts]
      x-stage: 1
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteHost
      summary: "Remove a host that runs no instances"
      tags: [hosts]
      x-stage: 1
      responses:
        "204":
          description: Done.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/hosts/{id}/drain:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: drainHost
      summary: "Move every instance off a host"
      description: |
        Stops placing nodes on the host, and replaces each node it runs with
        one on another host, one database at a time, with no downtime. Each move
        is a `replace` operation of its database. The host shows `draining`
        until it is empty, then `drained`, and `drain_error` says why a node
        cannot move yet. A one-node database cannot move without downtime, so a
        host that runs one answers `409`.
      tags: [hosts]
      x-stage: 4
      responses:
        "202":
          description: Accepted. The host's status tracks the drain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: undrainHost
      summary: "Let nodes land on a host again"
      description: Moves already started finish.
      tags: [hosts]
      x-stage: 4
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/backup-repositories:
    post:
      operationId: createBackupRepository
      summary: "Register a backup repository, once a host has proved it can write to it"
      tags: [backups]
      x-stage: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBackupRepository"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRepository"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    get:
      operationId: listBackupRepositories
      summary: "List backup repositories"
      tags: [backups]
      x-stage: 3
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRepositoryList"
        "401":
          $ref: "#/components/responses/Error"
  /v1/backup-repositories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteBackupRepository
      summary: "Remove a backup repository"
      tags: [backups]
      x-stage: 3
      responses:
        "204":
          description: Done.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/databases:
    post:
      operationId: createDatabase
      summary: "Create a database"
      tags: [databases]
      x-stage: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDatabase"
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    get:
      operationId: listDatabases
      summary: "List databases"
      tags: [databases]
      x-stage: 1
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseList"
        "401":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getDatabase
      summary: "Read a database"
      tags: [databases]
      x-stage: 1
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateDatabase
      summary: "Change resources, replication mode or retention"
      tags: [databases]
      x-stage: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDatabase"
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteDatabase
      summary: "Delete a database and its data"
      tags: [databases]
      x-stage: 1
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/restart:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: restartDatabase
      summary: "Restart with a rolling restart"
      tags: [databases]
      x-stage: 2
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/upgrade:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: upgradeDatabase
      summary: "Move to a newer minor release with a rolling restart"
      description: |
        Install the release on the database's hosts first, for example with a
        package upgrade or a new node image. Standbys restart first, then a
        switchover, then the old primary. Major upgrades restore into a new
        database instead.
      tags: [databases]
      x-stage: 5
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Upgrade"
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/switchover:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: switchoverDatabase
      summary: "Hand the primary role to a standby"
      tags: [databases]
      x-stage: 2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Switchover"
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/rotate-ca:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: rotateDatabaseCa
      summary: "Replace the CA and every node certificate, under load"
      tags: [databases]
      x-stage: 2
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/rotate-passwords:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: rotateDatabasePasswords
      summary: "Replace the internal passwords and the API key, under load"
      tags: [databases]
      x-stage: 2
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/backup:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: backupDatabase
      summary: "Take a backup now"
      tags: [backups]
      x-stage: 3
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: restoreDatabase
      summary: "Restore into a new database"
      tags: [backups]
      x-stage: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreDatabase"
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/owner-password:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: setOwnerPassword
      summary: "Replace the owner role's verifier"
      tags: [databases]
      x-stage: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerPassword"
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/allowlist:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAllowlist
      summary: "Read the allowlist"
      tags: [databases]
      x-stage: 1
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Allowlist"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: putAllowlist
      summary: "Replace the whole allowlist. Empty means no access"
      tags: [databases]
      x-stage: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Allowlist"
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/extensions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getExtensions
      summary: "Read the installed extensions"
      tags: [databases]
      x-stage: 1
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extensions"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: putExtensions
      summary: "Replace the whole list of extensions"
      tags: [databases]
      x-stage: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Extensions"
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/certificate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: putCertificate
      summary: "Replace the proxy certificate"
      description: |
        Every node's proxy presents this certificate to clients, with no
        restart. Raft, agents and Postgres keep the database's own CA. The key
        must belong to the certificate, and the certificate must be in date.
      tags: [databases]
      x-stage: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Certificate"
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/nodes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listNodes
      summary: "List a database's nodes"
      tags: [databases]
      x-stage: 1
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeList"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/nodes/{node}/replace:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: node
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: replaceNode
      summary: "Replace a node"
      tags: [databases]
      x-stage: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceNode"
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/backups:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listBackups
      summary: "List backups"
      tags: [backups]
      x-stage: 3
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/restore-window:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRestoreWindow
      summary: "Read the earliest and latest restorable times"
      tags: [backups]
      x-stage: 3
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreWindow"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Nothing to restore yet, or the database has no backups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/databases/{id}/replicas:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createReplica
      summary: "Add a cross-region replica"
      description: |
        An external standby of a three-node database, on a host outside its
        failure domains. It follows asynchronously, is not a Raft voter and is
        never a failover target. It shares the source's CA and passwords, so
        the source refuses `rotate-ca` and `rotate-passwords`, and deletion,
        while it has replicas. The host must run the same CPU architecture.
      tags: [replicas]
      x-stage: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReplica"
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    get:
      operationId: listReplicas
      summary: "List cross-region replicas"
      tags: [replicas]
      x-stage: 5
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplicaList"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/replicas/{replica_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: replica_id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteReplica
      summary: "Remove a cross-region replica"
      tags: [replicas]
      x-stage: 5
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/replicas/{replica_id}/promote:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: replica_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: promoteReplica
      summary: "Detach a replica into an independent database"
      description: |
        The replica stops following and becomes a one-node database with its
        own Raft group and backups. It keeps what it had replayed, so commits
        in flight on the source may be missing. It goes `active` once its first
        backup exists.
      tags: [replicas]
      x-stage: 5
      responses:
        "202":
          description: Accepted. The operation tracks the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/operations:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listOperations
      summary: "List a database's operations"
      tags: [operations]
      x-stage: 1
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationList"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/databases/{id}/operations/{op_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: op_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getOperation
      summary: "Read an operation with its steps and logs"
      tags: [operations]
      x-stage: 1
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationDetail"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/admin-ca:
    get:
      operationId: getAdminCa
      summary: "Read what to trust, and how far a rotation has got"
      tags: [operations]
      x-stage: 2
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCa"
        "401":
          $ref: "#/components/responses/Error"
  /v1/admin-ca/rotate:
    post:
      operationId: rotateAdminCa
      summary: "Start replacing the admin CA"
      description: |
        Moves through three phases, each once every enrolled host has caught up,
        so a host that stays away holds the rotation open. API clients must trust
        `bundle_pem` before the second phase, which changes this service's
        certificate.
      tags: [operations]
      x-stage: 2
      responses:
        "202":
          description: Accepted. `GET /v1/admin-ca` tracks it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCa"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/audit-log:
    get:
      operationId: listAuditLog
      summary: "Every change made through this API, and the key that made it"
      description: |
        Oldest first. Each request that is not a read is recorded with the
        name of its key, whether it succeeded or not. Name keys with
        `[[api.keys]]` in the config; a key in `api_key_hashes` is `key-1`,
        `key-2` and so on.
      tags: [operations]
      x-stage: 5
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
        - name: key
          in: query
          schema:
            type: string
        - name: database_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "401":
          $ref: "#/components/responses/Error"
  /v1/events:
    get:
      operationId: listEvents
      summary: "Read state changes after a cursor"
      tags: [operations]
      x-stage: 2
      parameters:
        - name: after
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "401":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerKey:
      type: http
      scheme: bearer
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    PageToken:
      name: page_token
      in: query
      schema:
        type: string
  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    Resources:
      type: object
      required: [vcpu, memory_gb, storage_gb]
      properties:
        vcpu:
          type: number
          exclusiveMinimum: true
          minimum: 0
        memory_gb:
          type: number
          exclusiveMinimum: true
          minimum: 0
        storage_gb:
          type: number
          exclusiveMinimum: true
          minimum: 0
    ReplicationMode:
      type: string
      enum: [async, sync, sync_strict]
    CreateHost:
      type: object
      required: [name]
      properties:
        name:
          type: string
        failure_domain:
          type: string
    HostEnrollment:
      type: object
      required: [host, enrollment_token, expires_at]
      properties:
        host:
          $ref: "#/components/schemas/Host"
        enrollment_token:
          type: string
          description: Shown once. Single-use, and ends in the hash of the CA certificate.
        expires_at:
          type: string
          format: date-time
    Host:
      type: object
      required: [id, name, status, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        failure_domain:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, online, offline, draining, drained]
        address:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        capacity:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Resources"
        free_capacity:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Resources"
          description: |
            What the scheduler can still place here: capacity less every
            instance, and less what it keeps back for the OS, the page cache
            and the disk's own needs.
        instances:
          type: integer
          format: int64
        postgres_versions:
          type: object
          additionalProperties:
            type: string
          description: 'Each Postgres major installed, and its full release, such as `{"18": "18.1"}`.'
        draining:
          type: boolean
        drain_error:
          type: string
          nullable: true
          description: Why the drain cannot move a node yet.
        drained_at:
          type: string
          format: date-time
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    Owner:
      type: object
      required: [username, scram_verifier]
      properties:
        username:
          type: string
        scram_verifier:
          type: string
          description: Generate this locally. The password never reaches the API.
    BackupPolicy:
      type: object
      required: [repository_id, retention_days]
      properties:
        repository_id:
          type: string
        retention_days:
          type: integer
          minimum: 1
    NoBackup:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          enum: [false]
    CreateDatabase:
      type: object
      required: [name, version, resources, owner, backup]
      properties:
        name:
          type: string
          description: Lowercase letters, digits and underscores, starting with a letter.
        workspace:
          type: string
          description: An opaque label for a layer above to group databases.
        version:
          type: string
          enum: ["16", "17", "18"]
        ha:
          type: boolean
          default: false
          description: Three nodes with automatic failover, one per failure domain.
        hosts:
          type: array
          items:
            type: string
          description: Host IDs or names, one per node. When left out, the most free hosts are chosen.
        resources:
          $ref: "#/components/schemas/Resources"
        replication_mode:
          allOf:
            - $ref: "#/components/schemas/ReplicationMode"
          description: Needs `ha`.
        owner:
          $ref: "#/components/schemas/Owner"
        allowed_cidrs:
          type: array
          items:
            type: string
          description: Empty means no access. Public access is the explicit entry `0.0.0.0/0`.
        extensions:
          type: array
          items:
            $ref: "#/components/schemas/ExtensionName"
        backup:
          oneOf:
            - $ref: "#/components/schemas/BackupPolicy"
            - $ref: "#/components/schemas/NoBackup"
          description: |
            A database with backups goes active only once it has a restorable
            backup. `{"enabled": false}` creates one with no backups: no
            repository, no WAL archive and no point-in-time restore.
    UpdateDatabase:
      type: object
      properties:
        resources:
          allOf:
            - $ref: "#/components/schemas/Resources"
          description: |
            Every node's host must have room for the growth. Storage only
            grows. CPU and storage change online; new memory takes a rolling
            restart on three nodes, and a restart on one. Not with
            `replication_mode` in the same request.
        replication_mode:
          $ref: "#/components/schemas/ReplicationMode"
        retention_days:
          type: integer
          minimum: 1
          description: Only for a database with backups.
        backup:
          allOf:
            - $ref: "#/components/schemas/BackupPolicy"
          description: |
            Turns backups on for a database created without them, in a request
            of its own, as an `enable_backup` operation. Archiving starts with
            no restart, and the restore window starts at the end of the first
            backup. Backups cannot be turned off.
    Upgrade:
      type: object
      properties:
        version:
          type: string
          description: A full release, such as `18.2`. When left out, the newest every host of the database has.
    Endpoint:
      type: object
      required: [host, port, database, ca_cert_pem]
      properties:
        host:
          type: string
        port:
          type: integer
        database:
          type: string
        ca_cert_pem:
          type: string
          description: Verifies the proxy, with `sslmode=verify-full`.
    Database:
      type: object
      required:
        - id
        - name
        - version
        - ha
        - status
        - generation
        - resources
        - replication_mode
        - allowed_cidrs
        - extensions
        - owner_username
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        workspace:
          type: string
          nullable: true
        version:
          type: string
        ha:
          type: boolean
        status:
          type: string
          enum: [provisioning, active, degraded, deleting, deleted, error]
        status_reason:
          type: string
          nullable: true
        generation:
          type: integer
          format: int64
        resources:
          $ref: "#/components/schemas/Resources"
        replication_mode:
          $ref: "#/components/schemas/ReplicationMode"
        allowed_cidrs:
          type: array
          items:
            type: string
        extensions:
          type: array
          items:
            $ref: "#/components/schemas/ExtensionName"
        owner_username:
          type: string
        endpoint:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Endpoint"
          description: One node's proxy, on a host that is online.
        endpoints:
          type: array
          description: Every node's proxy. Each routes writes to the primary.
          items:
            $ref: "#/components/schemas/NodeAddress"
        backup:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BackupPolicy"
          description: "`null` when the database has no backups."
        primary:
          type: string
          nullable: true
          description: The node the cluster last reported as primary. The cluster decides this.
        server_version:
          type: string
          nullable: true
          description: The release every node runs, such as `18.1`, or nothing while they differ.
        replica_of:
          type: string
          nullable: true
          description: The database this one is a cross-region replica of.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NodeAddress:
      type: object
      required: [host, port]
      properties:
        host:
          type: string
        port:
          type: integer
    Switchover:
      type: object
      properties:
        target:
          type: string
          description: The node to hand over to. When left out, the most current standby.
    AdminCa:
      type: object
      required: [bundle_pem, waiting_for]
      properties:
        phase:
          type: string
          nullable: true
          enum: [trust, issue, trim, null]
          description: Nothing when no rotation is running.
        bundle_pem:
          type: string
          description: Every CA to trust at the moment.
        waiting_for:
          type: array
          description: Hosts the current phase is waiting for.
          items:
            type: string
    OwnerPassword:
      type: object
      required: [scram_verifier]
      properties:
        scram_verifier:
          type: string
    Allowlist:
      type: object
      required: [allowed_cidrs]
      properties:
        allowed_cidrs:
          type: array
          items:
            type: string
    ExtensionName:
      type: string
      enum:
        - uuid-ossp
        - pgcrypto
        - pg_trgm
        - unaccent
        - vector
        - pg_stat_statements
        - pg_tle
        - postgis
        - pg_cron
    Extensions:
      type: object
      required: [extensions]
      properties:
        extensions:
          type: array
          items:
            $ref: "#/components/schemas/ExtensionName"
    Certificate:
      type: object
      required: [certificate_pem, private_key_pem]
      properties:
        certificate_pem:
          type: string
        private_key_pem:
          type: string
    Node:
      type: object
      required: [node, host_id, port_base, observed_generation, state]
      properties:
        node:
          type: string
        host_id:
          type: string
        host_name:
          type: string
        port_base:
          type: integer
        observed_generation:
          type: integer
          format: int64
        state:
          type: string
          enum: [pending, starting, seeding, running, failed]
        error:
          type: string
          nullable: true
        server_version:
          type: string
          nullable: true
    ReplaceNode:
      type: object
      required: [host_id]
      properties:
        host_id:
          type: string
    Operation:
      type: object
      required: [id, database_id, kind, status, target_generation, created_at]
      properties:
        id:
          type: string
        database_id:
          type: string
        kind:
          type: string
          enum:
            - create
            - update
            - rolling_update
            - replication_mode
            - delete
            - restart
            - switchover
            - backup
            - replace
            - rotate_ca
            - rotate_passwords
            - resize
            - upgrade
            - create_replica
            - promote_replica
            - enable_backup
        status:
          type: string
          enum: [pending, running, succeeded, failed]
        target_generation:
          type: integer
          format: int64
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
    OperationStep:
      type: object
      required: [seq, name, status, attempts]
      properties:
        seq:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [pending, done, failed]
        attempts:
          type: integer
        finished_at:
          type: string
          format: date-time
          nullable: true
    OperationLog:
      type: object
      required: [at, message]
      properties:
        at:
          type: string
          format: date-time
        source:
          type: string
        message:
          type: string
    OperationDetail:
      allOf:
        - $ref: "#/components/schemas/Operation"
        - type: object
          required: [steps, logs]
          properties:
            steps:
              type: array
              items:
                $ref: "#/components/schemas/OperationStep"
            logs:
              type: array
              items:
                $ref: "#/components/schemas/OperationLog"
    CreateBackupRepository:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [s3, posix]
        path:
          type: string
          description: For `posix`, an absolute path every host can reach.
        bucket:
          type: string
          description: For `s3`.
        prefix:
          type: string
        region:
          type: string
        endpoint:
          type: string
          description: For stores other than AWS.
        path_style:
          type: boolean
        access_key_id:
          type: string
          description: With `secret_access_key`. Left out, hosts use their instance role.
        secret_access_key:
          type: string
    BackupRepository:
      type: object
      required: [id, name, type, config, status, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [s3, posix]
        config:
          type: object
          description: Where it is. Credentials are never returned.
        status:
          type: string
          enum: [verifying, verified, failed]
        created_at:
          type: string
          format: date-time
    Backup:
      type: object
      required: [id, label, finished_at, size_bytes]
      properties:
        id:
          type: string
        label:
          type: string
        finished_at:
          type: string
          format: date-time
        size_bytes:
          type: integer
          format: int64
    RestoreDatabase:
      type: object
      required: [name, target_time]
      properties:
        name:
          type: string
        target_time:
          type: string
          format: date-time
          description: Within the restore window.
        hosts:
          type: array
          items:
            type: string
    RestoreWindow:
      type: object
      required: [earliest, latest]
      properties:
        earliest:
          type: string
          format: date-time
        latest:
          type: string
          format: date-time
    CreateReplica:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The replica's name as a database, which it keeps when promoted.
        host_id:
          type: string
          description: |
            A host by ID or name. When left out, the scheduler chooses one
            outside the source's failure domains, which a named host must be too.
    Replica:
      type: object
      required: [id, name, source_id, status, created_at]
      properties:
        id:
          type: string
          description: The replica's database ID.
        name:
          type: string
        source_id:
          type: string
        status:
          type: string
          enum: [provisioning, active, degraded, deleting, error]
        status_reason:
          type: string
          nullable: true
        host_id:
          type: string
          nullable: true
        host_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    AuditEntry:
      type: object
      required: [cursor, key_name, method, path, status, at]
      properties:
        cursor:
          type: string
        key_name:
          type: string
          description: The name of the API key that made the change.
        method:
          type: string
        path:
          type: string
        status:
          type: integer
          description: The HTTP status the change was answered with.
        database_id:
          type: string
          nullable: true
        at:
          type: string
          format: date-time
    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_page_token:
          type: string
          nullable: true
    Event:
      type: object
      required: [cursor, type, at]
      properties:
        cursor:
          type: string
        type:
          type: string
          description: For example `node_offline`, `failover_completed`, `backup_failed` or `replacement_needed`.
        database_id:
          type: string
          nullable: true
        node:
          type: string
          nullable: true
        detail:
          type: object
        at:
          type: string
          format: date-time
    HostList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Host"
        next_page_token:
          type: string
          nullable: true
    DatabaseList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Database"
        next_page_token:
          type: string
          nullable: true
    NodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        next_page_token:
          type: string
          nullable: true
    OperationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Operation"
        next_page_token:
          type: string
          nullable: true
    BackupRepositoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackupRepository"
        next_page_token:
          type: string
          nullable: true
    BackupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Backup"
        next_page_token:
          type: string
          nullable: true
    ReplicaList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Replica"
        next_page_token:
          type: string
          nullable: true
    EventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        next_page_token:
          type: string
          nullable: true
