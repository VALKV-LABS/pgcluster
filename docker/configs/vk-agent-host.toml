admin_url             = "https://pgcluster-admin:8444"
state_dir             = "/var/lib/vk-agent-host"
instances_dir         = "/var/lib/pgcluster/instances"
enrollment_token_file = "/run/enrollment-token"
# Clients reach this host through ports the stack publishes on localhost.
advertise_address     = "localhost"
runner                = "plain"
run_as                = "postgres"
# One machine, so there is nobody to keep out, and no privilege to do it with.
firewall              = "none"
