# Multi-Shard E2E stack — used by `make shard-start` / `make shard-stop`
#
# Topology:
#   1 coordinator pgcluster cluster (3 nodes, BM-7)
#   shard-0: 1 pgcluster + 1 Postgres  (key range [0, 10000))
#   shard-1: 1 pgcluster + 1 Postgres  (key range [10000, 20000))
#
# For E2E purposes each shard runs a single pgcluster + single Postgres.
# Per-shard HA depth (3 nodes) is already validated by the e2e-compose.yml stack.
# This stack focuses on coordinator routing, shard map, and connection-hint proxy.
#
# Port map (all exposed to host):
#   coordinator proxy     → localhost:5400   (connection-hint entry point)
#   coordinator API       → localhost:8400
#   coordinator metrics   → localhost:9400
#   shard-0 pgcluster     → localhost:5401
#   shard-0 API           → localhost:8401
#   shard-0 Postgres      → localhost:5481   (direct, bypass pgcluster)
#   shard-1 pgcluster     → localhost:5402
#   shard-1 API           → localhost:8402
#   shard-1 Postgres      → localhost:5482   (direct, bypass pgcluster)
#
# Quick validation after `make shard-start`:
#   curl http://localhost:8400/api/v1/shards | jq .
#   curl "http://localhost:8400/api/v1/shards/resolve?key=5000" | jq .
#   curl "http://localhost:8400/api/v1/shards/resolve?key=15000" | jq .
#   psql postgres://postgres:test@localhost:5400/postgres
#     SET pgcluster.shard_key = 5000;   -- routes to shard-0
#     SELECT current_setting('server_version');

services:

  # ── Shard-0 Postgres ────────────────────────────────────────────────────────

  pg-shard-0:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: postgres
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=5
        -c max_replication_slots=5
        -c listen_addresses='*'
    ports:
      - "5481:5432"
    volumes:
      - pg-shard-0-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  # ── Shard-1 Postgres ────────────────────────────────────────────────────────

  pg-shard-1:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: postgres
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=5
        -c max_replication_slots=5
        -c listen_addresses='*'
    ports:
      - "5482:5432"
    volumes:
      - pg-shard-1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

