# E2E stack — used by `make start` / `make stop`
#
# Provides: full 3-node pgcluster cluster (3 Postgres + 3 vk-agents + 3 pgcluster nodes)
# Purpose:  end-to-end user testing and validation of the full HA cluster
#
# Port map (all ports exposed to host):
#   pgcluster-1 proxy  → localhost:5432   (primary proxy entry point)
#   pgcluster-2 proxy  → localhost:15432
#   pgcluster-3 proxy  → localhost:25432
#   pgcluster-1 API    → localhost:8009
#   pgcluster-2 API    → localhost:18009
#   pgcluster-3 API    → localhost:28009
#   pgcluster-1 metrics→ localhost:9190
#   pgcluster-1 health → localhost:8008
#   pg-primary direct  → localhost:5490   (bypass proxy for debugging)
#   pg-replica-1 direct→ localhost:5491
#   pg-replica-2 direct→ localhost:5492
#
# Quick start:
#   make start
#   psql postgres://postgres:test@localhost:5432/postgres -c "SELECT version();"
#   curl http://localhost:8009/api/status | jq .
#   curl http://localhost:9190/metrics | grep pgcluster_raft_is_leader
#   curl -X POST -H "Authorization: Bearer dev-api-key" http://localhost:8009/api/... (writes need the key)
#   psql postgres://postgres:test@localhost:5490/postgres
#   psql postgres://postgres:test@localhost:5491/postgres

# Create a DB and table
# CREATE DATABASE myapp;
# CREATE TABLE users (id serial PRIMARY KEY, name text);
# INSERT INTO users (name) VALUES ('alice'), ('bob');
#SELECT * FROM users;
# Then verify replication by reading directly from each replica (bypassing the proxy):
# Read from replica-1 directly
#psql postgres://postgres:test@localhost:5491/myapp -c "SELECT * FROM users;"
# Read from replica-2 directly
# psql postgres://postgres:test@localhost:5492/myapp -c "SELECT * FROM users;"

x-node: &node
  build:
    context: ..
    dockerfile: docker/vk-agent.Dockerfile
  init: true
  restart: unless-stopped
  entrypoint: ["/bin/sh", "/usr/local/bin/node-entry.sh"]

services:

  # ── Certificates ────────────────────────────────────────────────────────────

  # Issues every certificate in the stack from one CA. Nodes run as uid 999 and
  # must be able to read their own keys.
  certs:
    build:
      context: ..
      dockerfile: docker/pgcluster.Dockerfile
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        pgcluster certs --out /certs
        pg-primary pg-replica-1 pg-replica-2 pg-new
        vk-agent-1 vk-agent-2 vk-agent-3 vk-agent-4
        pgcluster-1 pgcluster-2 pgcluster-3 &&
        chown 999:999 /certs/pg-*.key /certs/vk-agent-*.key
    volumes:
      - certs:/certs

  # ── Postgres nodes ──────────────────────────────────────────────────────────

  # One container per node, in which vk-agent owns Postgres. pg-primary creates
  # the first primary, and the others start empty until the leader seeds them.
  pg-primary:
    <<: *node
    depends_on:
      certs:
        condition: service_completed_successfully
    networks:
      default:
        aliases: [vk-agent-1]
      side-a:
        aliases: [vk-agent-1]
    environment:
      POSTGRES_PASSWORD: test
      PG_TLS_NAME: pg-primary
      PG_BOOTSTRAP: "1"
    ports:
      - "5490:5432"
      - "7001:7001"
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
      - ./node-entry.sh:/usr/local/bin/node-entry.sh:ro
      - ./pg-hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./configs/vk-agent-pg1.toml:/etc/vk-agent/config.toml:ro
      - certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 60

  pg-replica-1:
    <<: *node
    depends_on:
      pg-primary:
        condition: service_healthy
    networks:
      default:
        aliases: [vk-agent-2]
      side-b:
        aliases: [vk-agent-2]
    environment:
      POSTGRES_PASSWORD: test
      PG_TLS_NAME: pg-replica-1
    ports:
      - "5491:5432"
      - "17001:7001"
    volumes:
      - pg-replica-1-data:/var/lib/postgresql/data
      - ./node-entry.sh:/usr/local/bin/node-entry.sh:ro
      - ./pg-hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./configs/vk-agent-pg2.toml:/etc/vk-agent/config.toml:ro
      - certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 60

  pg-replica-2:
    <<: *node
    depends_on:
      pg-primary:
        condition: service_healthy
    networks:
      default:
        aliases: [vk-agent-3]
      side-b:
        aliases: [vk-agent-3]
    environment:
      POSTGRES_PASSWORD: test
      PG_TLS_NAME: pg-replica-2
    ports:
      - "5492:5432"
      - "27001:7001"
    volumes:
      - pg-replica-2-data:/var/lib/postgresql/data
      - ./node-entry.sh:/usr/local/bin/node-entry.sh:ro
      - ./pg-hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./configs/vk-agent-pg3.toml:/etc/vk-agent/config.toml:ro
      - certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 60

  # A spare node for tests of seeding. It has an empty data directory.
  vk-agent-4:
    <<: *node
    profiles: [spare]
    hostname: pg-new
    networks:
      default:
        aliases: [pg-new]
    environment:
      POSTGRES_PASSWORD: test
      PG_TLS_NAME: pg-new
    volumes:
      - pg-new-data:/var/lib/postgresql/data
      - ./node-entry.sh:/usr/local/bin/node-entry.sh:ro
      - ./configs/vk-agent-pg4.toml:/etc/vk-agent/config.toml:ro
      - certs:/certs:ro

  # ── pgcluster nodes ─────────────────────────────────────────────────────────

  pgcluster-1:
    networks: [default, side-a]
    build:
      context: ..
      dockerfile: docker/pgcluster.Dockerfile
    environment:
      POSTGRES_PASSWORD: test
    depends_on:
      pg-primary:
        condition: service_healthy
    volumes:
      - ./configs/pgcluster-1.toml:/etc/pgcluster/config.toml:ro
      - certs:/certs:ro
      - pgcluster-1-data:/var/lib/pgcluster
    ports:
      - "5432:5432"    # proxy
      - "8009:8009"    # REST API
      - "9190:9190"    # Prometheus metrics
      - "8008:8008"    # health endpoint
      - "7000:7000"    # Raft gRPC
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20

  pgcluster-2:
    networks: [default, side-b]
    build:
      context: ..
      dockerfile: docker/pgcluster.Dockerfile
    environment:
      POSTGRES_PASSWORD: test
    depends_on:
      pgcluster-1:
        condition: service_started
    volumes:
      - ./configs/pgcluster-2.toml:/etc/pgcluster/config.toml:ro
      - certs:/certs:ro
      - pgcluster-2-data:/var/lib/pgcluster
    ports:
      - "15432:5432"
      - "18009:8009"
      - "19190:9190"
      - "18008:8008"
      - "17000:7000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20

  pgcluster-3:
    networks: [default, side-b]
    build:
      context: ..
      dockerfile: docker/pgcluster.Dockerfile
    environment:
      POSTGRES_PASSWORD: test
    depends_on:
      pgcluster-1:
        condition: service_started
    volumes:
      - ./configs/pgcluster-3.toml:/etc/pgcluster/config.toml:ro
      - certs:/certs:ro
      - pgcluster-3-data:/var/lib/pgcluster
    ports:
      - "25432:5432"
      - "28009:8009"
      - "29190:9190"
      - "28008:8008"
      - "27000:7000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20

# Each side keeps its own network, so disconnecting one side from `default`
# partitions the cluster and leaves that side working. See e2e_partition_*.
networks:
  side-a:
  side-b:

volumes:
  certs:
  pg-primary-data:
  pg-replica-1-data:
  pg-replica-2-data:
  pg-new-data:
  pgcluster-1-data:
  pgcluster-2-data:
  pgcluster-3-data:
