# One-node stack for the host replacement test. Its volumes stand for the disk
# that survives when the VM around it is replaced.

services:
  certs:
    build:
      context: ..
      dockerfile: docker/pgcluster.Dockerfile
    entrypoint: ["/bin/sh", "-c"]
    command:
      - pgcluster certs --out /certs pg pgcluster && chown 999:999 /certs/pg.key
    volumes:
      - certs:/certs

  pg:
    build:
      context: ..
      dockerfile: docker/vk-agent.Dockerfile
    init: true
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/node-entry.sh"]
    environment:
      POSTGRES_PASSWORD: test
      PG_TLS_NAME: pg
      PG_BOOTSTRAP: "1"
    depends_on:
      certs:
        condition: service_completed_successfully
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./node-entry.sh:/usr/local/bin/node-entry.sh:ro
      - ./pg-hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./configs/vk-agent-single.toml:/etc/vk-agent/config.toml:ro
      - certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  pgcluster:
    build:
      context: ..
      dockerfile: docker/pgcluster.Dockerfile
    environment:
      POSTGRES_PASSWORD: test
      PGCLUSTER_AUTH_PASSWORD: dev-auth-password
    depends_on:
      pg:
        condition: service_healthy
    volumes:
      - ./configs/pgcluster-single.toml:/etc/pgcluster/config.toml:ro
      - pgcluster-data:/var/lib/pgcluster
      - certs:/certs:ro
    ports:
      - "5532:5432"
      - "8109:8009"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  certs:
  pg-data:
  pgcluster-data:
