# pgcluster example configuration
# Copy to /etc/pgcluster/config.toml and adjust for your environment.

[cluster]
# Unique name for this cluster.
name     = "my-pg-cluster"
# Local directory where pgcluster stores its Raft log and certs.
data_dir = "/var/lib/pgcluster"

[raft]
# This node's Raft peer ID (must match one entry in [[raft.peers]]).
node_id   = 1
# Set to true on the FIRST startup of a brand-new cluster.
# After bootstrap, set to false — re-bootstrapping an existing cluster is destructive.
bootstrap = true

[[raft.peers]]
id   = 1
addr = "10.0.0.1:7000"   # Raft RPC port (not the Postgres port)

[[raft.peers]]
id   = 2
addr = "10.0.0.2:7000"

[[raft.peers]]
id   = 3
addr = "10.0.0.3:7000"

# Each Postgres node in the cluster.
[[nodes.node]]
id            = "pg1"        # Logical name — must be unique
agent_addr    = "10.0.0.1:7001"   # vk-agent gRPC address on this host
postgres_addr = "10.0.0.1:5432"   # Postgres port (used by proxy)
priority      = 100               # Higher = preferred failover candidate

[[nodes.node]]
id            = "pg2"
agent_addr    = "10.0.0.2:7001"
postgres_addr = "10.0.0.2:5432"
priority      = 90

[[nodes.node]]
id            = "pg3"
agent_addr    = "10.0.0.3:7001"
postgres_addr = "10.0.0.3:5432"
priority      = 80

[replication]
replication_user         = "replicator"
# Name of the environment variable that holds the replication password.
replication_password_env = "PG_REPLICATION_PASSWORD"
slot_prefix              = "pgcluster_"
synchronous_standby_names = ""   # Set to "pg2,pg3" for synchronous replication

[proxy]
# Client applications connect to this address.
listen_addr        = "0.0.0.0:5432"
# pgcluster admin port (for internal traffic; not exposed to clients).
admin_listen_addr  = "0.0.0.0:5433"
# Simple HTTP /health endpoint for load-balancer health checks.
health_listen_addr = "0.0.0.0:8008"

[proxy.pool]
max_connections_per_db_user = 25
idle_timeout_seconds        = 600

[proxy.read_routing]
# Route SELECT statements to replicas when they are within lag threshold.
enabled               = true
max_replica_lag_bytes = 10485760   # 10 MiB

[failover]
health_check_interval_ms              = 500   # How often to poll vk-agent on each node
health_check_failures_before_failover = 3     # Consecutive failures before triggering failover
agent_heartbeat_timeout_seconds       = 10    # vk-agent enters safe mode after this

[tls]
# Set auto_generate = true for development (generates self-signed certs).
auto_generate = false
# For production, provide cert + key paths:
# ca_cert = "/etc/pgcluster/ca.crt"
# cert    = "/etc/pgcluster/node.crt"
# key     = "/etc/pgcluster/node.key"

[metrics]
listen_addr = "0.0.0.0:9090"   # Prometheus /metrics endpoint

[api]
listen_addr = "0.0.0.0:8080"   # REST API for cluster management
